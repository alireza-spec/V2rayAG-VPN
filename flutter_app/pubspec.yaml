name: v2rayag_vpn
description: V2rayAG VPN Flutter client foundation.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pin native networking/storage integrations to avoid silent behavior drift.
  flutter_vless: 1.1.6
  flutter_secure_storage: 11.2.0
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.4.2

dependency_overrides:
  flutter_vless_android: 1.1.6
  flutter_vless_platform_interface: 1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/v2rayag_mark.png
