name: Android validation and Google Play bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "prototype/**"
      - "*.md"
      - "flutter_app/*.md"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            target: android-arm64
          - name: armeabi-v7a
            target: android-arm
          - name: universal
            target: ""
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test V2rayAG private pool Worker
        if: matrix.name == 'universal'
        run: |
          cd ..
          node --check cloudflare/v2rayag-pool-worker.mjs
          node cloudflare/test-pool-worker.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=v2rayag_vpn .

      - name: Add Android launcher app picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if '<queries>' not in xml:
              query_block = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>'''
              xml, count = re.subn(r'(<manifest\b[^>]*>)', r'\1' + query_block, xml, count=1)
              if count != 1:
                  raise SystemExit('Could not configure launcher-only package visibility')
              manifest.write_text(xml)

          activities = list(Path('android/app/src/main/kotlin').rglob('MainActivity.kt'))
          if len(activities) != 1:
              raise SystemExit(f'Expected one generated Kotlin MainActivity, found {len(activities)}')
          path = activities[0]
          old = path.read_text()
          match = re.search(r'^package\s+([A-Za-z0-9_.]+)', old, re.M)
          if not match:
              raise SystemExit('Could not determine generated Android package')
          package = match.group(1)
          source = f'''package {package}

          import android.content.Intent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {{
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "v2rayag/app_picker")
                      .setMethodCallHandler {{ call, result ->
                          if (call.method != "listLaunchableApps") {{
                              result.notImplemented()
                              return@setMethodCallHandler
                          }}
                          val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                          val apps = packageManager.queryIntentActivities(intent, 0)
                              .mapNotNull {{ resolved ->
                                  val activity = resolved.activityInfo ?: return@mapNotNull null
                                  if (activity.packageName == packageName) return@mapNotNull null
                                  mapOf(
                                      "packageName" to activity.packageName,
                                      "label" to resolved.loadLabel(packageManager).toString()
                                  )
                              }}
                              .distinctBy {{ it["packageName"] }}
                              .sortedBy {{ it["label"]?.lowercase().orEmpty() }}
                          result.success(apps)
                      }}
              }}
          }}
          '''
          path.write_text(source)
          PY

      - name: Set Android launcher and installer name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          updated, count = re.subn(r'android:label="[^"]*"', 'android:label="V2rayAG"', xml, count=1)
          if count == 0:
              updated, count = re.subn(r'(<application\b)', r'\1 android:label="V2rayAG"', xml, count=1)
          if count != 1 or 'android:label="V2rayAG"' not in updated:
              raise SystemExit('Could not set the Android display name')
          manifest.write_text(updated)
          PY

      - name: Apply V2rayAG launcher and notification icons
        run: |
          set -euo pipefail
          cp -R android_brand/res/. android/app/src/main/res/
          test -s android/app/src/main/res/drawable-nodpi/ic_v2rayag_notification.png
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          for attribute, value in (
              ('android:icon', '@mipmap/ic_launcher'),
              ('android:roundIcon', '@mipmap/ic_launcher_round'),
          ):
              pattern = re.escape(attribute) + r'="[^"]*"'
              if re.search(pattern, xml):
                  xml = re.sub(pattern, f'{attribute}="{value}"', xml, count=1)
              else:
                  xml, count = re.subn(r'(<application\b)', rf'\1 {attribute}="{value}"', xml, count=1)
                  if count != 1:
                      raise SystemExit(f'Could not configure {attribute}')
          manifest.write_text(xml)
          PY

      - name: Apply crisp V2rayAG Android launch splash
        run: |
          set -euo pipefail
          cp android_brand/res/drawable-nodpi/v2rayag_splash.png android/app/src/main/res/drawable-nodpi/v2rayag_splash.png
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path('android/app/src/main/res')
          launch = res / 'drawable' / 'launch_background.xml'
          launch.parent.mkdir(parents=True, exist_ok=True)
          launch.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="#0B100E" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/v2rayag_splash" />
              </item>
          </layer-list>
          ''')

          base_styles = res / 'values' / 'styles.xml'
          if not base_styles.is_file():
              raise SystemExit('Generated Android theme styles were not found')
          text = base_styles.read_text()
          pattern = re.compile(r'(<style\s+name="LaunchTheme"[^>]*>)(.*?)(</style>)', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('Could not find generated LaunchTheme')
          body = match.group(2)
          for name, value in (
              ('android:windowSplashScreenBackground', '#0B100E'),
              ('android:windowSplashScreenAnimatedIcon', '@drawable/v2rayag_splash'),
              ('android:windowSplashScreenIconBackgroundColor', '#0B100E'),
          ):
              item = re.compile(r'<item\s+name="' + re.escape(name) + r'">.*?</item>', re.S)
              replacement = f'<item name="{name}">{value}</item>'
              if item.search(body):
                  body = item.sub(replacement, body, count=1)
              else:
                  body += chr(10) + '        ' + replacement
          launch_style = match.group(1) + body + match.group(3)
          target = res / 'values-v31' / 'styles.xml'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
          ''' + launch_style + '''
          </resources>
          ''')
          print('Android 12 and legacy launch screens use the crisp V2rayAG mark.')
          PY

      - name: Set a Play-compatible Android package ID for tagged releases
        env:
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          app_id = os.environ.get('ANDROID_APPLICATION_ID', '').strip()
          is_release = os.environ.get('GITHUB_REF', '').startswith('refs/tags/v')
          if is_release and not app_id:
              raise SystemExit('Set the unique ANDROID_APPLICATION_ID repository variable before making a Play bundle')
          if not app_id:
              print('No Play package ID configured; keeping generated placeholder for CI-only builds.')
              raise SystemExit(0)
          if not re.fullmatch(r'[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z][A-Za-z0-9_]*)+', app_id):
              raise SystemExit('ANDROID_APPLICATION_ID is not a valid reverse-domain Android ID')
          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          if gradle.suffix == '.kts':
              updated, count = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{app_id}"', text, count=1)
          else:
              updated, count = re.subn(r'applicationId\s+"[^"]+"', f'applicationId "{app_id}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not set the generated Android application ID')
          gradle.write_text(updated)
          PY

      - name: Set minimum Android API for encrypted storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              if path.suffix == '.kts':
                  updated = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = maxOf(flutter.minSdkVersion, 23)')
              else:
                  updated = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              if updated != text:
                  path.write_text(updated)
                  changed = True
                  break
          if not changed:
              raise SystemExit('Could not set Android minSdk to 23 in generated project')
          PY

      - name: Configure native VPN packaging and disable backup of secure-storage data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android:allowBackup=' in xml:
              xml, count = re.subn(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', xml, count=1)
              if count != 1:
                  raise SystemExit('Could not disable Android app backups')
          else:
              xml, count = re.subn(r'(<application\b)', r'\1 android:allowBackup="false"', xml, count=1)
              if count != 1:
                  raise SystemExit('Could not configure Android app backup policy')
          if 'android:allowBackup="false"' not in xml:
              raise SystemExit('Android app backups must be disabled for Keystore-backed storage')
          manifest.write_text(xml)

          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit('Could not locate generated Android app Gradle file')
          text = gradle.read_text()
          if 'useLegacyPackaging' not in text:
              text, count = re.subn(
                  r'(android\s*\{)',
                  r'\1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not enable native VPN runtime packaging')
              gradle.write_text(text)
          PY

      - name: Exclude Keystore-backed preferences from Android backups and device transfer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          xml_dir = Path('android/app/src/main/res/xml')
          xml_dir.mkdir(parents=True, exist_ok=True)
          (xml_dir / 'secure_storage_backup_rules.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="sharedpref" path="FlutterSecureStorage.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration.xml" />
              <exclude domain="sharedpref" path="v2rayag_secure_store_v2.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v2.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v2.xml" />
              <exclude domain="sharedpref" path="v2rayag_secure_store_v3.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v3.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v3.xml" />
              <exclude domain="sharedpref" path="v2rayag_pool_device_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_pool_device_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_pool_device_v1.xml" />
              <exclude domain="sharedpref" path="v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_auto_access_v1.xml" />
          </full-backup-content>
          ''')
          (xml_dir / 'secure_storage_data_extraction_rules.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="FlutterSecureStorage.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration.xml" />
                  <exclude domain="sharedpref" path="v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="v2rayag_pool_device_v1.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_pool_device_v1.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_pool_device_v1.xml" />
              <exclude domain="sharedpref" path="v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_auto_access_v1.xml" />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="sharedpref" path="FlutterSecureStorage.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration.xml" />
                  <exclude domain="sharedpref" path="v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v2.xml" />
                  <exclude domain="sharedpref" path="v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_secure_store_v3.xml" />
                  <exclude domain="sharedpref" path="v2rayag_pool_device_v1.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_pool_device_v1.xml" />
                  <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_pool_device_v1.xml" />
              <exclude domain="sharedpref" path="v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureKeyStorage:v2rayag_auto_access_v1.xml" />
              <exclude domain="sharedpref" path="FlutterSecureStorageConfiguration:v2rayag_auto_access_v1.xml" />
              </device-transfer>
          </data-extraction-rules>
          ''')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          for attribute, value in (
              ('android:fullBackupContent', '@xml/secure_storage_backup_rules'),
              ('android:dataExtractionRules', '@xml/secure_storage_data_extraction_rules'),
          ):
              pattern = re.escape(attribute) + r'="[^"]*"'
              if re.search(pattern, xml):
                  xml = re.sub(pattern, f'{attribute}="{value}"', xml, count=1)
              else:
                  xml, count = re.subn(r'(<application\b)', rf'\1 {attribute}="{value}"', xml, count=1)
                  if count != 1:
                      raise SystemExit(f'Could not configure {attribute}')
          manifest.write_text(xml)
          PY

      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Ensure the custom V2rayAG notification glyph is used as fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          pub_cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          rel = Path('android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt')
          candidates = [
              pub_cache / 'hosted/pub.dev/flutter_vless_android-1.1.6' / rel,
              pub_cache / 'hosted/pub.dartlang.org/flutter_vless_android-1.1.6' / rel,
          ]
          service = next((path for path in candidates if path.exists()), None)
          if service is None:
              raise SystemExit('Pinned flutter_vless_android 1.1.6 service source was not found')
          text = service.read_text()
          marker = 'val resolvedV2rayAgSmallIcon = current?.let { profile ->'
          old_icon = '.setSmallIcon(current?.APPLICATION_ICON?.takeIf { it != 0 } ?: android.R.drawable.ic_dialog_info)'
          if marker not in text:
              anchor = '        val current = config\n'
              if anchor not in text:
                  raise SystemExit('Could not locate the VPN notification setup in the pinned engine')
              icon_setup = '''        val current = config
          val resolvedV2rayAgSmallIcon = current?.let { profile ->
              val name = profile.NOTIFICATION_ICON_RESOURCE_NAME.ifBlank { "ic_v2rayag_notification" }
              val type = profile.NOTIFICATION_ICON_RESOURCE_TYPE.ifBlank { "drawable" }
              resources.getIdentifier(name, type, packageName).takeIf { it != 0 }
          }
          val smallIcon = current?.APPLICATION_ICON?.takeIf { it != 0 }
              ?: resolvedV2rayAgSmallIcon
              ?: applicationInfo.icon.takeIf { it != 0 }
              ?: android.R.drawable.ic_dialog_info
          '''
              text = text.replace(anchor, icon_setup, 1)
          if old_icon in text:
              text = text.replace(old_icon, '.setSmallIcon(smallIcon)', 1)
          elif '.setSmallIcon(smallIcon)' not in text:
              raise SystemExit('Could not replace the generic notification fallback icon')
          service.write_text(text)
          print('V2rayAG notification-icon fallback is configured in the native service.')
          PY

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Prepare the stable Google Play upload key
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'universal'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          if not gradle.exists():
              raise SystemExit('Expected the generated Kotlin Gradle file for signed Play builds')
          text = gradle.read_text()
          if 'ANDROID_UPLOAD_KEYSTORE_PATH' in text:
              raise SystemExit('Signing setup was already applied; refusing duplicate Gradle edits')
          declarations = '''val uploadStorePath = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
          val uploadStorePassword = System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
          val uploadKeyAlias = System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
          val uploadKeyPassword = System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
          val hasUploadSigning = listOf(uploadStorePath, uploadStorePassword, uploadKeyAlias, uploadKeyPassword).all { !it.isNullOrBlank() }

          '''
          if not re.search(r'\bandroid\s*\{', text):
              raise SystemExit('Could not locate Android Gradle configuration')
          text = re.sub(r'\bandroid\s*\{', declarations + 'android {', text, count=1)
          signing = '''android {
              signingConfigs {
                  if (hasUploadSigning) {
                      create("playUpload") {
                          storeFile = file(uploadStorePath!!)
                          storePassword = uploadStorePassword
                          keyAlias = uploadKeyAlias
                          keyPassword = uploadKeyPassword
                      }
                  }
              }
          '''
          text, count = re.subn(r'\bandroid\s*\{', signing, text, count=1)
          if count != 1:
              raise SystemExit('Could not configure the Play upload signing key')
          debug, count = re.subn(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("playUpload")',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not attach the stable key to the release build type')
          gradle.write_text(debug)
          PY

      - name: Build APK
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            flutter build apk --release --target-platform "${{ matrix.target }}"
          else
            flutter build apk --release
          fi
          mkdir -p "$RUNNER_TEMP/v2rayag-apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk"

      - name: Upload CI APK artifact (unsigned preview)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-${{ matrix.name }}-preview
          path: ${{ runner.temp }}/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build signed Google Play bundle
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'universal'
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ github.workspace }}/flutter_app/android/app/upload-keystore.jks
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release
          mkdir -p "$RUNNER_TEMP/v2rayag-play"
          cp build/app/outputs/bundle/release/app-release.aab \
            "$RUNNER_TEMP/v2rayag-play/V2rayAG-VPN.aab"

      - name: Upload signed Play bundle
        if: startsWith(github.ref, 'refs/tags/v') && matrix.name == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: android-play-bundle
          path: ${{ runner.temp }}/v2rayag-play/V2rayAG-VPN.aab
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Create draft Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed Play bundle
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release with signed Play bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Android Play Store candidate

          This draft contains a signed Android App Bundle (AAB) for upload to Google Play
          Console. Do not distribute an APK from GitHub if the goal is to avoid sideloading
          warnings: publish through Google Play, which signs the delivered APKs with Play
          App Signing. An upload-key signature alone cannot guarantee Play Protect will
          approve an APK installed outside the Play Store.

          The app still requires real-device VPN testing with valid provider profiles.
          Never commit subscription URLs, server credentials, or signing keys.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.aab \
            --draft \
            --title "$GITHUB_REF_NAME — Google Play candidate" \
            --notes-file release-notes.md
