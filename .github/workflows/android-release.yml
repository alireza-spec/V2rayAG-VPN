name: Android preview builds

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "prototype/**"
      - "*.md"
      - "flutter_app/*.md"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            target: android-arm64
          - name: armeabi-v7a
            target: android-arm
          - name: universal
            target: ""
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=v2rayag_vpn .

      - name: Set Android launcher and installer name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          updated, count = re.subn(r'android:label="[^"]*"', 'android:label="V2rayAG VPN"', xml, count=1)
          if count == 0:
              updated, count = re.subn(r'(<application\b)', r'\1 android:label="V2rayAG VPN"', xml, count=1)
          if count != 1 or 'android:label="V2rayAG VPN"' not in updated:
              raise SystemExit('Could not set the Android display name')
          manifest.write_text(updated)
          PY

      - name: Set minimum Android API for encrypted storage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          changed = False
          for path in candidates:
              if not path.exists():
                  continue
              text = path.read_text()
              if path.suffix == '.kts':
                  updated = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = maxOf(flutter.minSdkVersion, 23)')
              else:
                  updated = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              if updated != text:
                  path.write_text(updated)
                  changed = True
                  break
          if not changed:
              raise SystemExit('Could not set Android minSdk to 23 in generated project')
          PY

      - name: Configure native VPN packaging and disable backup of secure-storage data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'android:allowBackup=' in xml:
              xml, count = re.subn(r'android:allowBackup="[^"]*"', 'android:allowBackup="false"', xml, count=1)
              if count != 1:
                  raise SystemExit('Could not disable Android app backups')
          else:
              xml, count = re.subn(r'(<application\b)', r'\1 android:allowBackup="false"', xml, count=1)
              if count != 1:
                  raise SystemExit('Could not configure Android app backup policy')
          if 'android:allowBackup="false"' not in xml:
              raise SystemExit('Android app backups must be disabled for Keystore-backed storage')
          manifest.write_text(xml)

          candidates = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit('Could not locate generated Android app Gradle file')
          text = gradle.read_text()
          if 'useLegacyPackaging' not in text:
              text, count = re.subn(
                  r'(android\s*\{)',
                  r'\1\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('Could not enable native VPN runtime packaging')
              gradle.write_text(text)
          PY

      - name: Remove generated placeholder widget test
        run: rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            flutter build apk --release --target-platform "${{ matrix.target }}"
          else
            flutter build apk --release
          fi
          mkdir -p "$RUNNER_TEMP/v2rayag-apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: ${{ runner.temp }}/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Android preview build

          These APKs are CI preview builds for device testing, not a Play Store release.
          They are not signed with a production release key. Do not use them for sensitive
          traffic until the Android tunnel has been tested on real devices and the release
          signing and bundled-runtime notices have been reviewed.

          - `V2rayAG-arm64-v8a.apk`: 64-bit ARM Android devices
          - `V2rayAG-armeabi-v7a.apk`: 32-bit ARM Android devices
          - `V2rayAG-universal.apk`: combined Flutter Android target architectures

          The app does not read or display the device's public/source IP. Use only test
          server profiles you control; never commit subscription URLs or server credentials.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --draft \
            --title "$GITHUB_REF_NAME — Android preview" \
            --notes-file release-notes.md
