name: Android preview builds

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "prototype/**"
      - "*.md"
      - "flutter_app/*.md"
  pull_request:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build ${{ matrix.name }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64-v8a
            target: android-arm64
          - name: armeabi-v7a
            target: android-arm
          - name: universal
            target: ""
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name=v2rayag_vpn .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APK
        shell: bash
        run: |
          if [[ -n "${{ matrix.target }}" ]]; then
            flutter build apk --release --target-platform "${{ matrix.target }}"
          else
            flutter build apk --release
          fi
          mkdir -p "$RUNNER_TEMP/v2rayag-apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$RUNNER_TEMP/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.name }}
          path: ${{ runner.temp }}/v2rayag-apk/V2rayAG-${{ matrix.name }}.apk
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Android preview build

          These APKs are CI preview builds for device testing, not a Play Store release.
          They are not signed with a production release key. Do not use them for sensitive
          traffic until the Android tunnel has been tested on real devices and the release
          signing and bundled-runtime notices have been reviewed.

          - `V2rayAG-arm64-v8a.apk`: 64-bit ARM Android devices
          - `V2rayAG-armeabi-v7a.apk`: 32-bit ARM Android devices
          - `V2rayAG-universal.apk`: combined Flutter Android target architectures

          The app does not read or display the device's public/source IP. Use only test
          server profiles you control; never commit subscription URLs or server credentials.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --draft \
            --title "$GITHUB_REF_NAME — Android preview" \
            --notes-file release-notes.md
